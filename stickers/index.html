<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mis stickers · Canela Negra</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="../favicon-64.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{overflow-x:clip;max-width:100%;width:100%}body{margin:0;min-height:100svh;background:#0d0d0d;color:#f2e5d5;font-family:"IBM Plex Sans",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:28px 16px 36px;text-align:center;box-sizing:border-box}
.logo{width:min(180px,65vw);height:auto;margin-bottom:8px}
h1{font-size:24px;margin:8px 0 6px;letter-spacing:-.02em}
.lead{max-width:340px;color:rgba(242,229,213,.72);font-size:14px;margin:0 0 16px;line-height:1.45}
form{width:100%;max-width:360px;text-align:left;min-width:0;box-sizing:border-box}
label{display:block;font-size:12px;font-weight:700;margin:0 0 6px;letter-spacing:.04em;text-transform:uppercase;opacity:.8}
input{width:100%;font-size:18px;padding:14px 16px;min-height:48px;border-radius:4px;border:0;text-align:center;font-family:inherit;background:#fff;color:#0d0d0d}
button{width:100%;margin-top:10px;padding:14px;min-height:48px;border-radius:4px;border:0;background:#f2e5d5;color:#0d0d0d;font:700 15px "IBM Plex Sans";cursor:pointer}
@media(min-width:768px){form,#out,.demo,.lead{max-width:420px}body{padding:40px 28px 48px}h1{font-size:28px}}
.err{color:#ffb4a8;min-height:1.3em;font-size:13px;margin:10px 0 0;font-weight:500;text-align:center}
#out{width:100%;max-width:360px;margin-top:6px;min-width:0;box-sizing:border-box}
.pcard{background:#161616;border:1px solid #2a2a2a;border-radius:8px;padding:16px 14px;margin-top:12px;text-align:left;position:relative;overflow:hidden;box-shadow:0 10px 28px rgba(0,0,0,.4);max-width:100%;width:100%;box-sizing:border-box;min-width:0}
.pcard::before{content:"";position:absolute;inset:0;opacity:.16;background-image:url("../logo-claro.png");background-size:160px;background-repeat:no-repeat;background-position:108% -8%;pointer-events:none}
.pcard .brand{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.7;position:relative}
.pcard .prize{display:inline-block;margin:12px 0;font-size:12px;font-weight:700;background:#284375;color:#fff;padding:5px 10px;border-radius:3px;position:relative}
.pcard .who{font-size:20px;font-weight:700;position:relative}
.pcard .who small{display:block;font-size:13px;font-weight:500;opacity:.6;margin-top:2px}
.stamps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:16px 0;position:relative;width:100%;max-width:100%;min-width:0}
.stamps i{aspect-ratio:1;width:100%;min-width:0;border-radius:50%;border:1.5px dashed rgba(242,229,213,.35);background:rgba(242,229,213,.05);box-sizing:border-box}
.stamps i.on{background:#f2e5d5;border-style:solid;border-color:#f2e5d5;box-shadow:inset 0 0 0 4px #284375}
.stamps i.prize{border-color:rgba(255,79,23,.6);background:rgba(255,79,23,.12)}
.pcard .foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #2a2a2a;padding-top:12px;font-size:13px;position:relative;color:rgba(242,229,213,.75)}
.pcard .foot strong{color:#f2e5d5;font-size:15px}
.hint{background:#161616;border:1px solid #2a2a2a;border-radius:6px;padding:14px;margin-top:12px;font-size:14px;color:rgba(242,229,213,.8);line-height:1.4;text-align:left}
.demo{font-size:11px;opacity:.5;margin-top:auto;padding-top:28px;max-width:360px}
.demo a{color:#f2e5d5}
</style>
</head>
<body>
<img class="logo" src="../logo-claro.png" alt="Canela Negra">
<h1>Mis stickers</h1>
<p class="lead">Escribe tu RUT y mira tu tarjeta: cuántos sellos llevas y cuántos te faltan para el capuchino o americano gratis.</p>
<form onsubmit="ver();return false">
  <label for="r">RUT</label>
  <input id="r" inputmode="text" placeholder="12.345.678-5" autocomplete="off">
  <button type="submit">Ver mi tarjeta</button>
</form>
<p class="err" id="e"></p>
<div id="out"></div>
<p class="demo">Demo Lokio · datos solo en este teléfono · <a href="../">Volver</a></p>
<script src="../fid.js"></script>
<script>
function stamps(n,meta){
  let h='';
  for(let i=0;i<meta;i++) h+=`<i class="${i<n?'on':''}${i===meta-1?' prize':''}"></i>`;
  return `<div class="stamps">${h}</div>`;
}
function ver(){
  const r=FID.limpia(document.getElementById('r').value);
  const e=document.getElementById('e'),o=document.getElementById('out');
  o.innerHTML='';
  if(!FID.valido(r)){e.textContent='RUT no válido. Revisa el dígito final.';return}
  e.textContent='';
  const d=FID.db(),c=d.clientes[r];
  if(!c){o.innerHTML='<div class="hint">Aún no estás en la tarjeta digital. Pídelo en caja: RUT, nombre y correo.</div>';return}
  const n=c.stickers,f=d.meta-n,nom=c.nombre.split(' ')[0].replace(/[<>&]/g,'');
  const status=f<=0?`Completaste la tarjeta. Cobra en caja: ${d.premio}`:`Llevas ${n} de ${d.meta}. Faltan ${f} para: ${d.premio}`;
  o.innerHTML=`<div class="pcard">
    <div class="brand">Canela Negra · fidelidad</div>
    <div class="prize">${d.premio.replace(/[<>&]/g,'')}</div>
    <div class="who">${nom}<small>${FID.fmt(r)}</small></div>
    ${stamps(n,d.meta)}
    <div class="foot"><span>${status.replace(/[<>&]/g,'')}</span><strong>${n}/${d.meta}</strong></div>
  </div>`;
}
</script>
</body>
</html>
