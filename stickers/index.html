<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis stickers · Canela Negra</title><meta name="robots" content="noindex,nofollow"><link rel="icon" href="../favicon-64.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Fraunces:wght@700&display=swap" rel="stylesheet">
<style>body{margin:0;min-height:100svh;background:#14161c;color:#f2e5d5;font-family:"DM Sans",sans-serif;display:flex;flex-direction:column;align-items:center;padding:28px 20px;box-sizing:border-box;text-align:center}
img{width:96px;border-radius:50%}h1{font-family:Fraunces,serif;font-size:30px;margin:14px 0 6px}input{width:100%;max-width:340px;font-size:20px;padding:16px;border-radius:999px;border:0;text-align:center;margin:16px 0 10px;box-sizing:border-box}
button{width:100%;max-width:340px;padding:16px;border-radius:999px;border:0;background:#f2e5d5;color:#14161c;font:700 17px "DM Sans"}
.card{background:#000;border:1px solid #333;border-radius:24px;padding:22px;margin-top:22px;width:100%;max-width:360px;box-sizing:border-box}.card b{font-family:Fraunces,serif;letter-spacing:.06em}
.dots{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:16px 0}.dots span{aspect-ratio:1;border-radius:50%;background:rgba(242,229,213,.18)}.dots span.on{background:#f2e5d5}
.err{color:#ffb4a8;min-height:1.4em}.demo{font-size:12px;opacity:.6;margin-top:auto;padding-top:24px}a{color:#f2e5d5}</style></head><body>
<img src="../logo-claro.png" alt="Canela Negra cafetería y heladería" style="width:220px;border-radius:0"><h1>Mis stickers</h1><p>Escribe tu RUT y mira cuánto te falta para tu premio.</p>
<input id="r" inputmode="text" placeholder="12.345.678-5" autocomplete="off"><button onclick="ver()">Ver mis stickers</button><p class="err" id="e"></p><div id="out"></div>
<p class="demo">Demo de propuesta Lokio · datos de prueba guardados solo en este teléfono · <a href="../">Volver</a></p>
<script src="../fid.js"></script><script>
function ver(){const r=FID.limpia(document.getElementById('r').value),e=document.getElementById('e'),o=document.getElementById('out');o.innerHTML='';
if(!FID.valido(r)){e.textContent='Ese RUT no es válido. Revisa el número y el dígito final.';return}e.textContent='';
const d=FID.db(),c=d.clientes[r];if(!c){o.innerHTML='<div class="card">Aún no estás registrado. Pídelo en caja en tu próxima visita.</div>';return}
const n=c.stickers,f=d.meta-n;o.innerHTML=`<div class="card"><b>TARJETA DE FIDELIDAD</b><p>Hola ${c.nombre.split(' ')[0].replace(/[<>&]/g,'')}</p><div class="dots">${Array.from({length:d.meta},(_,i)=>`<span class="${i<n?'on':''}"></span>`).join('')}</div><p>${f<=0?'¡Completaste tu tarjeta! Cobra en caja: '+d.premio:`Llevas ${n} de ${d.meta}. Te faltan ${f} para: ${d.premio}`}</p></div>`}
</script></body></html>
